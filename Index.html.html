<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LeverHelder</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3ee;--card:#fff;--ink:#17301f;--mute:#5b6f61;--acc:#1f6b45;--accfg:#fff;--line:#d3ddd5;
--ok:#1f8f4f;--okbg:#dff1e5;--warn:#b4530a;--warnbg:#fdebd8;--bad:#b3261e;--badbg:#fbdedb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a14;--card:#1a2a20;--ink:#e6f2ea;--mute:#9bb2a3;--acc:#5cc58b;--accfg:#08200f;--line:#2b4033;--ok:#5cc58b;--okbg:#1f3a29;--warn:#f0a05a;--warnbg:#3a2511;--bad:#ff8a80;--badbg:#42201d}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 'Atkinson Hyperlegible',system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:28px;line-height:1.15;margin:6px 0 8px}h2{font-size:20px;margin:0 0 6px}p{margin:0 0 10px}
.mute{color:var(--mute);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
button{font:inherit;font-weight:700;border:0;border-radius:16px;padding:16px;min-height:60px;cursor:pointer;background:var(--acc);color:var(--accfg);width:100%;margin-top:10px}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:active{transform:scale(.98)}button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.chip{display:inline-block;background:var(--okbg);color:var(--ok);font-weight:700;font-size:14px;border-radius:99px;padding:4px 12px}
.hero{text-align:center;border-radius:24px;padding:20px 16px;margin:14px 0}
.hero.ok{background:var(--okbg)}.hero.warn{background:var(--warnbg)}.hero.bad{background:var(--badbg)}.hero.none{background:var(--card);border:1px solid var(--line)}
.hero h2{font-size:28px;margin:8px 0 4px}
.ring text{font:700 30px 'Atkinson Hyperlegible',sans-serif;fill:var(--ink)}
.tile{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);margin-top:10px}
.tile .ic{font-size:30px}.tile small{display:block;font-weight:400;color:var(--mute)}.tile.done{border-color:var(--ok)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 18px}.bar i{display:block;height:100%;background:var(--acc)}
.big{font-size:44px;font-weight:700;text-align:center;margin:30px 0;min-height:60px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{background:var(--card);color:var(--ink);border:2px solid var(--line);margin:0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.keys button{background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:24px;margin:0}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}.yn button{min-height:80px;font-size:22px}
#box{height:260px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;text-align:center;padding:16px;user-select:none;margin:20px 0;background:var(--line)}
.prog{font-size:15px;color:var(--mute);text-align:center}svg{width:100%;height:auto;overflow:visible}
body{--bg:#071426;--card:#0e2444;--ink:#eaf2ff;--mute:#9db3d4;--acc:#1d7bd8;--accfg:#fff;--line:#1c3a66;--ok:#3ddc84;--okbg:#0f3a2c;--warn:#ffb54a;--warnbg:#3d2c0e;--bad:#ff6b6b;--badbg:#431b22;background:radial-gradient(circle at 80% 0,#0d2f5e,#071426 55%) fixed}
main{padding-bottom:110px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hero2{position:relative;overflow:hidden;border-radius:22px;padding:20px 16px 80px;background:linear-gradient(135deg,#0c2f5c,#06182f 70%);border:1px solid var(--line);margin-bottom:14px}
.hero2 h1{margin:0 0 6px}.hero2 p{max-width:60%;font-size:16px}
.hero2 button{width:auto;padding:12px 20px;min-height:48px;border-radius:99px}
.brain{position:absolute;right:-6px;top:8px;font-size:96px;filter:drop-shadow(0 0 20px #38bdf8)}
.pulse{position:absolute;left:0;right:0;bottom:12px;width:100%;height:40px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:12px 0}
.art{height:100px;display:flex;align-items:center;justify-content:center;font-size:54px}
.a-dieren{background:linear-gradient(135deg,#6b4f2a,#2f5d3a)}.a-stroop{background:linear-gradient(135deg,#7a1f3d,#1d4ed8)}.a-reactie{background:linear-gradient(135deg,#1c2b3a,#3a6f8f)}.a-cijfers{background:linear-gradient(135deg,#12305c,#2b5aa8)}
.gb{padding:14px}.gb h3{margin:0 0 4px;font-size:20px}
.gr{display:flex;align-items:center;justify-content:space-between;gap:10px}.gr button{width:auto;padding:10px 22px;min-height:46px;margin:0;border-radius:99px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;background:#06111f;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{background:none;color:var(--mute);min-height:54px;margin:0;font-size:13px;padding:6px;border-radius:14px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center}
.tabs button.on{color:#fff;background:var(--acc)}
.nb{font-size:68px;font-weight:700;line-height:1}.nb span{font-size:44px;margin-left:10px}
.rw{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:16px}
.br{display:flex;align-items:center;gap:8px;margin:10px 0}.bl{width:48px;font-size:14px}.bt{flex:1;height:22px;background:var(--line);border-radius:8px;overflow:hidden}.bt i{display:block;height:100%}
.nu{background:var(--acc);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px}
h1{font-size:30px;font-weight:700;letter-spacing:-.4px}
.card,.gc{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015)),var(--card);border:1px solid rgba(120,170,255,.18);box-shadow:0 10px 26px rgba(0,0,0,.3)}
button{background:linear-gradient(180deg,#348fee,#1565c4);box-shadow:0 6px 16px rgba(29,123,216,.38);transition:transform .12s,box-shadow .12s}
button.alt,.grid button,.keys button{background:rgba(255,255,255,.05);box-shadow:none;color:var(--ink)}
button:active{transform:scale(.97)}
.tabs{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(6,17,31,.85)}
.tabs button{box-shadow:none}.tabs button.on{background:rgba(29,123,216,.3);color:#fff}
.hero{border-radius:26px;padding:24px 16px;box-shadow:0 12px 32px rgba(0,0,0,.32)}
.hero2{box-shadow:0 16px 40px rgba(0,0,0,.45)}
.brain{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
@keyframes draw{from{stroke-dasharray:0 400}}
.ring circle:nth-of-type(2){animation:draw .9s ease-out}
.ring text{font-size:34px}
.art{position:relative;height:112px;font-size:60px}
.gc.done{border-color:var(--ok)}
.gc.done .art::after{content:var(--done,"Gedaan");position:absolute;top:10px;right:10px;background:var(--ok);color:#06210f;font:700 13px system-ui,sans-serif;padding:3px 11px;border-radius:99px}
.big{text-shadow:0 0 26px rgba(77,163,255,.3)}
.bar{height:10px}.bar i{background:linear-gradient(90deg,#348fee,#3ddc84);border-radius:9px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.row2{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);border:1px solid rgba(120,170,255,.18);border-radius:18px;padding:12px 14px;margin:10px 0;min-height:68px;color:var(--ink);box-shadow:none}
.row2 b{display:block}.row2 small{display:block;font-weight:400;color:var(--mute)}.row2 i{margin-left:auto;font-style:normal;font-size:26px;color:var(--mute)}
.ico{width:46px;height:46px;border-radius:50%;background:rgba(34,184,255,.15);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.ico.big{width:64px;height:64px;font-size:34px;border:4px solid #22b8ff;background:none}
.mini{width:52px;flex:none}
.lg{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:6px;z-index:5}
.lgb{width:auto;min-height:36px;padding:6px 12px;margin:0;border-radius:99px;font-size:14px}.lgi{display:flex;gap:10px}.lgi .lgb{flex:1;min-height:48px;font-size:16px}
.ei{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em}.ei svg{width:100%;height:100%}
.ico,.brain,.hand,.spb{color:#22b8ff}.art{color:#fff}.tabs .ei{font-size:24px}.ico .ei{font-size:26px}
.tb{width:100%;border-collapse:collapse;font-size:15px}.tb th,.tb td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}.tb th{color:var(--mute)}
@media print{body{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#bbb;--ok:#117a3a;--warn:#a85500;--bad:#b00020;background:#fff!important}.tabs,button{display:none!important}.card{box-shadow:none!important;background:#fff!important}}
.prof{display:flex;gap:14px;align-items:center}.av{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#2f8df0,#22b8ff);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;flex:none}.gear{width:44px;min-height:44px;padding:0;margin:0;border-radius:50%;background:rgba(255,255,255,.06);box-shadow:none;font-size:20px}
.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:14px}.ov .ico{margin:0 auto 6px}
.steps{display:flex;align-items:center;justify-content:center;margin:22px 0}.st{width:36px;height:36px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700}.st.on{background:#1d8fff}.ln{width:30px;height:2px;background:var(--line)}
.hand{font-size:90px;text-align:center;margin:18px 0}
.sp{min-height:calc(100vh - 80px);display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:50px}
.spb{font-size:88px;filter:drop-shadow(0 0 24px #22b8ff)}.spt{font-size:54px;margin:6px 0 14px}.spp{font-size:21px;line-height:1.5}.spf{margin-top:auto;width:100%}
#box{width:min(280px,80vw);height:min(280px,80vw);border-radius:50%;border:10px solid #22b8ff;margin:20px auto}
</style></head><body><main id="app"></main>
<script>
const KEY='alertheid-v2',$=document.getElementById('app');
const GAMES={dieren:['Dierentest','🐘','1 minuut dieren noemen'],stroop:['Kleurentest','🎨','8 vragen'],reactie:['Reactiesnelheid','⚡','5 keer tikken'],cijfers:['Cijferreeks','🔢','onthoud cijfers']};
const LEVELS={
1:{naam:'Groep 1: stabiel',uitleg:'Je lever is op dit moment stabiel. Elke dag 3 korte spelletjes, met de dierentest als eerste.',games:['dieren','stroop','reactie'],thr:20,ok:60,warn:40,extra:''},
2:{naam:'Groep 2: verhoogd risico',uitleg:'Je hebt een hoger risico op sufheid. Elke dag 4 spelletjes en een scherpere waarschuwing.',games:['dieren','stroop','reactie','cijfers'],thr:15,ok:65,warn:45,extra:"Let ook op je slaapritme: overdag slapen en 's nachts wakker zijn is een vroeg signaal."},
3:{naam:'Groep 3: wachtlijst transplantatie',uitleg:'Je wacht op een levertransplantatie. Elke dag 4 spelletjes en de gevoeligste waarschuwing.',games:['dieren','stroop','reactie','cijfers'],thr:10,ok:70,warn:50,extra:'Bel bij een daling meteen je transplantatiecentrum en houd je telefoon bereikbaar.'}};
const Q=[['Sta je op de wachtlijst voor een levertransplantatie?',0],['Ben je ooit opgenomen of erg verward geweest door je lever (hepatische encefalopathie)?',2],['Gebruik je lactulose of rifaximine tegen sufheid?',2],['Heb je ooit buikvocht of een bloeding uit slokdarmaders gehad?',1],['Heb je levercirrose?',1]];
let H={},LV=0;try{H=JSON.parse(localStorage.getItem(KEY)||'{}');LV=+(localStorage.getItem(KEY+'-lv')||0)}catch(e){}
let NM='';try{NM=localStorage.getItem(KEY+'-nm')||''}catch(e){}
let ST={};try{ST=JSON.parse(localStorage.getItem(KEY+'-st')||'{}')}catch(e){}
let LG=[];try{LG=JSON.parse(localStorage.getItem(KEY+'-log')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(H));localStorage.setItem(KEY+'-lv',LV);localStorage.setItem(KEY+'-log',JSON.stringify(LG.slice(-300)));localStorage.setItem(KEY+'-st',JSON.stringify(ST))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10),clamp=v=>Math.max(0,Math.min(100,Math.round(v))),avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
const total=d=>{const v=Object.values(H[d]||{});return v.length?avg(v):null};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));let timer=null,gen=0;const stop=()=>{clearTimeout(timer);gen++};

/* Direct oordeel: meteen vanaf de eerste meting, en vergelijking met eerdere dagen zodra die er zijn */
function verdict(n){const L=LEVELS[LV];
  const prevs=Object.keys(H).filter(d=>d<today()&&total(d)!=null).slice(-7).map(total),base=prevs.length?avg(prevs):null;
  let k=n>=L.ok?'ok':n>=L.warn?'warn':'bad';
  if(base!=null){const drop=base-n;if(drop>=L.thr*1.5)k='bad';else if(drop>=L.thr&&k==='ok')k='warn'}
  const T={ok:['Goed: je bent alert',''],
   warn:['Let op: lager dan normaal',''],
   bad:['Niet goed','']}[k];
  return {k,t:T[0],d:T[1],base}}
function ring(n,k,s=150,lab){const c=2*Math.PI*52,col=k?`var(--${k})`:'var(--line)';
  return `<svg class="ring" width="${s}" height="${s}" viewBox="0 0 120 120" style="width:${s}px;display:block;margin:0 auto"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*(n||0)/100} ${c}" transform="rotate(-90 60 60)"/><text x="60" y="69" text-anchor="middle">${n==null?'–':lab!=null?lab:Math.round(n)}</text></svg>`}

/* Vragenlijst, daarna indeling in een groep */
let I={i:0,p:0,tx:false};
function intake(){stop();I={i:0,p:0,tx:false};
  $.innerHTML=`<h1>Welkom bij de Alertheidsmeter</h1><p>Beantwoord eerst 5 korte vragen. Dan kiest de app de juiste groep en de juiste spelletjes voor jou.</p><button onclick="ask()">Start de vragen</button><p class="mute" style="margin-top:16px">Dit is een hulpmiddel en geen diagnose.</p>`}
function ask(){const [t]=Q[I.i];
  $.innerHTML=`<div class="prog">Vraag ${I.i+1} van ${Q.length}</div><div class="bar"><i style="width:${I.i/Q.length*100}%"></i></div><h1>${t}</h1><p class="mute">Weet je het niet zeker? Kies dan Ja. De app let dan extra goed op.</p><div class="yn"><button onclick="ans(1)">Ja</button><button class="alt" onclick="ans(0)">Nee</button></div>${I.i?'<button class="alt" onclick="I.i--;ask()">Vorige vraag</button>':''}`}
function ans(y){if(I.i===0)I.tx=!!y;else I[I.i]=y?Q[I.i][1]:0;
  if(I.i<Q.length-1){I.i++;return ask()}
  let p=0;for(let j=1;j<Q.length;j++)p+=I[j]||0;
  LV=I.tx?3:p>=3?2:1;PERS=true;try{localStorage.setItem(KEY+'-pers','1')}catch(e){}save();const L=LEVELS[LV];
  $.innerHTML=`<div class="hero ok"><div style="font-size:48px">✅</div><h1>${L.naam}</h1><p>${L.uitleg}</p></div><h2>Alle groepen</h2>${[1,2,3].map(k=>`<div class="card" style="${k===LV?'border:2px solid var(--ok)':'opacity:.55'}"><b>${k===LV?'Jij: ':''}${LEVELS[k].naam}</b><p class="mute" style="margin:4px 0 0">${LEVELS[k].uitleg}</p></div>`).join('')}<p class="mute">Klopt dit niet? Je kunt je antwoorden later opnieuw invullen. Laat je groep ook controleren door je arts.</p><button onclick="home()">Naar mijn meter</button>`}

function home(){stop();if(!LV)return intake();
  const L=LEVELS[LV],t=H[today()]||{},n=total(today()),v=n!=null?verdict(n):null;
  $.innerHTML=`<span class="chip">${L.naam}</span>
  <div class="hero ${v?v.k:'none'}">${ring(n,v&&v.k)}<h2>${v?v.t:'Nog geen meting vandaag'}</h2><p>${v?v.d:'Doe een spelletje en je ziet meteen hoe alert je bent.'}</p></div>
  <h2>Mijn spelletjes van vandaag</h2>
  ${L.games.map(g=>`<button class="tile ${t[g]!=null?'done':''}" onclick="start('${g}')"><span class="ic">${GAMES[g][1]}</span><span>${GAMES[g][0]}<small>${t[g]!=null?lab(g,t[g])+'. '+(g==='dieren'?Math.round(t[g]/5)+' dieren':'Score '+t[g])+'. Tik om opnieuw':GAMES[g][2]}</small></span></button>`).join('')}
  <div class="card" id="st">${stoolBox()}</div>
  <button class="alt" onclick="stats('dag')">📊 Statistieken per dag en uur</button>
  <div class="card"><h2>Mijn verloop</h2>${chart()}</div>
  <p class="mute">Geen diagnose. Bij klachten of twijfel: bel altijd je arts.</p>
  <button class="alt" onclick="intake()">Vragen opnieuw invullen</button>
  <button class="alt" onclick="if(confirm('Alle scores wissen?')){H={};save();home()}">Scores wissen</button>`}
function stoolLab(c){return c===0?['bad','🔴 Niet goed']:(c===1||c>=4)?['warn','🟠 Let op']:['ok','🟢 Goed']}
function stoolBox(){const c=ST[today()]||0,[k,l]=stoolLab(c);return `<h2>🚽 Ontlasting vandaag</h2><div style="display:flex;align-items:center;gap:12px"><div class="big" style="margin:0;min-height:0;font-size:52px;flex:0 0 70px">${c}</div><div style="flex:1"><b style="color:var(--${k})">${l}</b><div class="mute">Meestal goed: 2 tot 3 keer per dag</div></div></div><div class="yn"><button onclick="stool(1)">+1</button><button class="alt" onclick="stool(-1)">Een terug</button></div>`}
function stool(d){const t=today();ST[t]=Math.max(0,(ST[t]||0)+d);save();document.getElementById('st').innerHTML=stoolBox()}
function stats(m){stop();const L=LEVELS[LV],col=s=>s>=L.ok?'ok':s>=L.warn?'warn':'bad';let rows=[];
  if(m==='dag'){rows=Object.keys(H).filter(d=>total(d)!=null).sort().slice(-14).reverse().map(d=>[d.slice(8)+'-'+d.slice(5,7),total(d)])}
  else{const by={},s0=new Date();s0.setHours(0,0,0,0);LG.filter(x=>x.t>=s0.getTime()).forEach(x=>{const h=new Date(x.t).getHours();(by[h]=by[h]||[]).push(x.s)});rows=Object.keys(by).sort((a,b)=>a-b).map(h=>[String(h).padStart(2,'0')+':00',avg(by[h])])}
  $.innerHTML=`<h1>Statistieken</h1><div class="yn"><button class="${m==='dag'?'':'alt'}" onclick="stats('dag')">Per dag</button><button class="${m==='uur'?'':'alt'}" onclick="stats('uur')">Per uur</button></div><div class="card"><h2>${m==='dag'?'Gemiddelde score per dag':'Vandaag per uur'}</h2>${rows.length?rows.map(r=>`<div style="display:flex;align-items:center;gap:10px;margin:10px 0"><span style="width:56px;font-size:15px">${r[0]}</span><div style="flex:1;background:var(--line);border-radius:9px;height:26px;overflow:hidden"><i style="display:block;height:100%;width:${Math.max(4,r[1])}%;background:var(--${col(r[1])})"></i></div><b style="width:34px;text-align:right">${Math.round(r[1])}</b></div>`).join(''):'<p class="mute">Nog geen metingen.</p>'}</div><p class="mute">Groen is goed, oranje let op, rood niet goed.</p><button onclick="home()">Terug</button>`}
function lab(g,s){const c=Math.round(s/5),L=LEVELS[LV],k=g==='dieren'?(c>=15?'ok':c>=10?'warn':'bad'):(s>=L.ok?'ok':s>=L.warn?'warn':'bad');return {ok:'🟢 Goed',warn:'🟠 Let op',bad:'🔴 Niet goed'}[k]}
function chart(){const d=Object.keys(H).filter(k=>total(k)!=null).sort().slice(-14);
  if(d.length<2)return '<p class="mute">Vanaf de tweede dag zie je hier je verloop.</p>';
  const W=320,Ht=130,x=i=>24+i*(W-48)/(d.length-1),y=v=>Ht-10-v*(Ht-30)/100,P=d.map((k,i)=>[x(i),y(total(k))]);

  if(EN_EX[s])r=v.replace(s,EN_EX[s]);else{const p=EN_PA.find(x=>x[0].test(s));r=p?v.replace(s,s.replace(p[0],p[1])):v.replace(EN_RE,m=>EN_MAP[m])}
  if(r!==v)t.nodeValue=r});
 root.querySelectorAll('input[placeholder]').forEach(i=>{const k=i.dataset.p||i.placeholder;if(EN_PH[k]){i.dataset.p=k;i.placeholder=EN_PH[k]}})}
new MutationObserver(()=>trans($)).observe($,{childList:true,subtree:true,characterData:true});
function LANGBTN(from){const sh=from==='splash';return [['nl',sh?'NL':'Nederlands'],['en',sh?'EN':'English']].map(x=>`<button class="lgb ${LANG===x[0]?'':'alt'}" onclick="setLang('${x[0]}','${from}')">${x[1]}</button>`).join('')}
function setLang(l,from){LANG=l;try{localStorage.setItem(KEY+'-lang',l)}catch(e){}document.documentElement.lang=l;document.body.style.setProperty('--done',l==='en'?'"Done"':'"Gedaan"');if(from==='splash')splash();else inst()}
document.documentElement.lang=LANG;document.body.style.setProperty('--done',LANG==='en'?'"Done"':'"Gedaan"');
home();
</script></body></html>
